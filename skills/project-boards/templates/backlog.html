<title>Project Backlog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: header with the Last updated pill, the guided "still to fill in" cards, count pills and the priority legend,
   a labelled filter grid, the ranked Epics table (priority spine, group break per band), compact detail cards, then
   Delivered and Not pursuing. One column at phone width; wide tables scroll inside their own box. Data lives in the db. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --fg:#16231F; --muted:#56655F; --line:#D7DFDB; --soft:#E9EFEC;
  --accent:#1D5C54; --accent-fg:#FFFFFF; --focus:#2A8A7E; --warn-bg:#FFF1D6; --warn-fg:#7A4B00; --err-fg:#9B1C14;
  --need-bg:#FFF8E8; --need-line:#E8C873; --need-fg:#5C4300;
  --p0-bg:#FBE3E1; --p0-fg:#9B1C14; --p0-dot:#D93A2B; --p1-bg:#FDEBD9; --p1-fg:#8A4300; --p1-dot:#E8801E;
  --p2-bg:#FBF3CF; --p2-fg:#6B5600; --p2-dot:#C9A30F; --p3-bg:#E5ECF3; --p3-fg:#2F4A63; --p3-dot:#6E8BA6;
  --pq-bg:#E7E9E8; --pq-fg:#4A5552; --pq-dot:#9AA4A1; --done-bg:#DFF1E6; --done-fg:#1C5E37;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#16201D; --fg:#E2EAE7; --muted:#9BAAA6; --line:#2A3834; --soft:#1D2926;
  --accent:#6CC4B8; --accent-fg:#06201C; --focus:#86D6CB; --warn-bg:#3D2C0C; --warn-fg:#FFD27A; --err-fg:#FFB4AB;
  --need-bg:#2E260F; --need-line:#7A6224; --need-fg:#F5DC9A;
  --p0-bg:#4A1A16; --p0-fg:#FFB4AB; --p0-dot:#FF6A5A; --p1-bg:#47290C; --p1-fg:#FFC58C; --p1-dot:#F39A45;
  --p2-bg:#3D340B; --p2-fg:#F3DA6B; --p2-dot:#E2C33A; --p3-bg:#1E2D3B; --p3-fg:#AFC6DC; --p3-dot:#8AA7C2;
  --pq-bg:#27302E; --pq-fg:#B4C0BC; --pq-dot:#7D8A86; --done-bg:#163824; --done-fg:#9BE0B5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#16201D; --fg:#E2EAE7; --muted:#9BAAA6; --line:#2A3834; --soft:#1D2926;
  --accent:#6CC4B8; --accent-fg:#06201C; --focus:#86D6CB; --warn-bg:#3D2C0C; --warn-fg:#FFD27A; --err-fg:#FFB4AB;
  --need-bg:#2E260F; --need-line:#7A6224; --need-fg:#F5DC9A;
  --p0-bg:#4A1A16; --p0-fg:#FFB4AB; --p0-dot:#FF6A5A; --p1-bg:#47290C; --p1-fg:#FFC58C; --p1-dot:#F39A45;
  --p2-bg:#3D340B; --p2-fg:#F3DA6B; --p2-dot:#E2C33A; --p3-bg:#1E2D3B; --p3-fg:#AFC6DC; --p3-dot:#8AA7C2;
  --pq-bg:#27302E; --pq-fg:#B4C0BC; --pq-dot:#7D8A86; --done-bg:#163824; --done-fg:#9BE0B5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px 56px}
h1{font:680 30px/1.12 var(--body);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:650 19px/1.2 var(--body);margin:0 0 10px;text-wrap:balance}
h3{font:600 15.5px/1.3 var(--body);margin:0;min-width:0;overflow-wrap:anywhere}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}
.top>div{min-width:0}
.lede{color:var(--muted);margin:6px 0 0;max-width:70ch}
.live{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}

.lastup{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:6px;margin:12px 0 0;padding:5px 14px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-weight:650;font-size:14px;font-variant-numeric:tabular-nums}
.lastup .rel{color:inherit;opacity:.85;font-weight:500}
.src{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.needs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));margin:18px 0 0}
.needs__h{grid-column:1/-1;margin:0;font-size:13px;color:var(--muted)}
.need{background:var(--need-bg);border:1px dashed var(--need-line);color:var(--need-fg);border-radius:8px;padding:10px 14px;font-size:13.5px;display:grid;gap:3px;min-width:0}
.need b{font-weight:650}
.need code{font:500 12.5px var(--mono);overflow-wrap:anywhere;background:none;color:inherit}
.need .who{font-weight:600}
.counts{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 0}
.count{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--soft);color:var(--fg)}

.d-P0{background:var(--p0-dot)}.d-P1{background:var(--p1-dot)}.d-P2{background:var(--p2-dot)}.d-P3{background:var(--p3-dot)}.d-P\?{background:var(--pq-dot)}

.legend b{color:var(--fg);display:flex;align-items:center;gap:7px;font-size:13.5px;margin-bottom:2px}
.fbar{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:10px 18px;align-items:center;margin:26px 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}

.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}

.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

.hint{font-size:13px;color:var(--muted);margin:0 0 8px}
.tblw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
#main{min-width:900px}
.tbl2{min-width:620px}
th{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
tbody.itm.first td{border-top:2px solid var(--line)}
tbody.itm.drag{opacity:.4}
tbody.itm.over td{box-shadow:inset 0 2px 0 var(--accent)}
td.sp{width:4px;padding:0}
td.sp i{display:block;width:4px;min-height:46px;height:100%;border-radius:2px}
.hd{cursor:grab;color:var(--muted);user-select:none;font-size:16px;line-height:1;padding:2px 4px;border-radius:4px;background:none;border:0}
.rk{font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.key{font:600 13px var(--mono);color:var(--accent);text-decoration:none;white-space:nowrap}
.key--none{color:var(--need-fg);background:var(--need-bg);border-radius:4px;padding:0 5px;font-weight:600}
.slug{display:block;font:500 11px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:20ch;margin-top:2px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.p-P0{background:var(--p0-bg);color:var(--p0-fg)}.p-P1{background:var(--p1-bg);color:var(--p1-fg)}.p-P2{background:var(--p2-bg);color:var(--p2-fg)}
.p-P3{background:var(--p3-bg);color:var(--p3-fg)}.p-P\?{background:var(--pq-bg);color:var(--pq-fg)}
.tag,.dep{font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--soft);color:var(--muted);text-decoration:none;white-space:nowrap}
.dep--warn{background:var(--warn-bg);color:var(--warn-fg)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.it{min-width:240px}
.it b{display:block;font-weight:600;overflow-wrap:anywhere}
.nosum{display:block;font-size:12px;color:var(--need-fg);margin-top:2px}
.s{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.st{font-size:12.5px;font-weight:600;white-space:nowrap}
.st-blocked{color:var(--err-fg)}.st-active{color:var(--accent)}
.when{white-space:nowrap;font-size:13px;font-variant-numeric:tabular-nums}
.rel{display:block;font-size:12px;color:var(--muted)}
.lastup .rel{display:inline}
code,.mono{font:500 13px var(--mono)}
a{color:var(--accent)}
:is(button,select,a,input,textarea,summary,.chip):focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sec{margin-top:34px}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0;scroll-margin-top:16px}
.card:target{outline:2px solid var(--accent)}
.card__h{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card__sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.back{font-size:12.5px;color:var(--accent);text-decoration:none;margin-left:auto}
.card p{margin:6px 0 0;font-size:14px;overflow-wrap:anywhere}
.card p.dt{color:var(--muted);font-size:13.5px}
.meta{display:grid;grid-template-columns:96px minmax(0,1fr);gap:3px 12px;margin:8px 0 0;font-size:13px}
.meta dt{color:var(--muted);font-weight:600}.meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.np summary{cursor:pointer;font-size:12px;color:var(--muted);margin-top:4px;list-style:none}
.np summary::-webkit-details-marker{display:none}
.np[open] summary{color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.btn,select,input[type="text"]{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:4px 9px;font:600 13px var(--body)}
.btn{cursor:pointer}.btn--p{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.empty{padding:18px;color:var(--muted);text-align:center}
.minor td{color:var(--muted)}
.done-tag{background:var(--done-bg);color:var(--done-fg);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.notice{background:var(--warn-bg);color:var(--warn-fg);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:13.5px}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;color:var(--muted);margin-top:18px}
@media (max-width:640px){h1{font-size:25px}.meta{grid-template-columns:1fr}.fbar{grid-template-columns:minmax(0,1fr);gap:6px}.fbar .lbl:not(:first-child){margin-top:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
"use strict";
/* pm:render-begin */
const ID_RE=/^[A-Za-z0-9._-]+$/;
const KEY_RE=/^[A-Z]{2,3}-[1-9][0-9]{0,8}$/;

const STATUSES=["untriaged","queued","active","paused","later","blocked","planned","archived"];
const RSTATUS=["planned","in-progress","shipped"];
const esc=s=>String(s==null?"":s).replace(/[&<>"'`]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;","`":"&#96;"})[c]);
const num=x=>(typeof x==="number"&&isFinite(x))?String(x):"0";
const H=x=>String(x);
const str=x=>typeof x==="string"?x:"";
const arr=x=>Array.isArray(x)?x:[];
const okId=x=>typeof x==="string"&&ID_RE.test(x);
const okKey=x=>typeof x==="string"&&KEY_RE.test(x);
const safeUrl=u=>(typeof u==="string"&&/^https?:\/\/[^\s"'<>`\\]+$/i.test(u))?u:"";
const prioOf=p=>(typeof p==="string"&&LEVELS.indexOf(p)>=0)?p:"P?";
const oneOf=(x,list)=>(typeof x==="string"&&list.indexOf(x)>=0)?x:"other";
const inlineJson=v=>{const j=JSON.stringify(v);return (j===undefined?"null":j).replace(/</g,"\\u003c");};
const safe=(fn,dflt)=>{try{return fn();}catch(_){return dflt;}};
const step=(label,fn)=>{try{return String(fn());}catch(_){return '<div class="notice" role="status">'+esc(label)+' could not be drawn. The rest of the board is unaffected.</div>';}};
const byPos=(a,b)=>{const pa=a.position==null?1e15:a.position,pb=b.position==null?1e15:b.position;return pa-pb||String(a.id).localeCompare(String(b.id));};
/** The project's name and key, checked the way set-project checks them; anything else reads as unset. */
function projOf(p){

/** A human timestamp: absolute ("Nov 11, 2:10 PM", in the viewer's locale and time zone unless o pins them) and, past one day, relative. */

  const sameYear=safe(()=>new Date(t).toLocaleString(O.locale,{year:"numeric",timeZone:opt.timeZone})===new Date(now).toLocaleString(O.locale,{year:"numeric",timeZone:opt.timeZone}),true);
  if(!sameYear)opt.year="numeric";

}
const whenHtml=(iso,o,none)=>{const w=when(iso,o);return w.abs?`<span class="when">${esc(w.abs)}</span>${H(w.rel?`<span class="rel">${esc(w.rel)}</span>`:"")}`:`<span class="s">${esc(none||"no date recorded")}</span>`;};
/** A guided empty state: what is missing, the engine command that sets it, and who supplies it. */
const need=(id,what,cmd,who)=>`<div class="need" data-need="${esc(id)}" role="note"><b>${esc(what)}</b><span>Set it with <code>${esc(cmd)}</code></span><span class="who">${esc(who)}</span></div>`;
const ASK_USER="Ask the user: only the user knows this. Never invent it.";
const AGENT_DRAFTS="The agent drafts it, then asks the user to confirm.";
function normEpic(d){
  try{
    if(!d||typeof d!=="object"||Array.isArray(d)||!okId(d.id))return null;
    const n=v=>(typeof v==="number"&&isFinite(v))?v:null;
    return {id:d.id,key:okKey(d.key)?d.key:"",title:str(d.title),summary:str(d.summary),whyNow:str(d.whyNow),description:str(d.description),lane:str(d.lane),
      status:str(d.status),priority:prioOf(d.priority),meritPriority:prioOf(d.meritPriority),position:n(d.position),
      release:okId(d.release)?d.release:"",externalUrl:str(d.externalUrl),dependsOn:arr(d.dependsOn).filter(okId),
      delivered:d.delivered===true?true:(d.delivered===false?false:null),outcome:str(d.outcome),outcomeReason:str(d.outcomeReason),
      endedAt:str(d.endedAt),updatedAt:str(d.updatedAt)};

}
const skippedNote=n=>n>0?`<p class="hint">Skipped ${num(n)} record${H(n===1?"":"s")} with an unusable id or shape.</p>`:"";
const linkOrText=raw=>{const u=safeUrl(raw);return u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>`:esc(str(raw));};
const keyHtml=e=>e.key?`<span class="key">${esc(e.key)}</span>`:'<span class="key key--none">no key</span>';

const REASONS=["Won't do","Deferred","For consideration","Merged"];
const LEGEND={P0:"Urgent: blocks a release or its users now. Dragging never makes an epic P0.",P1:"High: needed for the release being worked toward.",
  P2:"Medium: wanted, with a clear next step.",P3:"Low: later, or waiting on another epic."};
const HINT_CROSS="Priority changes go through the agent: ask it to change the priority, then refresh the board.";
/** Filters are page-local UI state: {q, prio[], status[], release ("" any, "-" none, or an id), lane[]}. */
function normFilter(F){
  const f=(F&&typeof F==="object")?F:{};

const filtering=F=>{const f=normFilter(F);return !!(f.q.trim()||f.prio.length||f.status.length||f.release||f.lane.length);};
function matches(e,F){
  const f=normFilter(F);
  const inList=(v,l)=>!l.length||l.indexOf(v)>=0;
  if(!inList(e.priority,f.prio)||!inList(e.status,f.status)||!inList(e.lane,f.lane))return false;
  if(f.release==="-"){if(e.release)return false;}else if(f.release&&e.release!==f.release)return false;
  const q=f.q.trim().toLowerCase();
  if(q&&[e.key,e.id,e.title,e.summary,e.release,e.lane].join(" ").toLowerCase().indexOf(q)<0)return false;
  return true;
}
function dropProposal(epicsIn,dragId,targetId,after){
  const open=[];
  arr(epicsIn).forEach(d=>{const e=normEpic(d);if(e&&e.status!=="archived")open.push(e);});
  const d=open.find(e=>e.id===dragId),t=open.find(e=>e.id===targetId);
  if(!d||!t)return {ok:false,hint:"That row is no longer on the board. Reload the page and try again."};
  if(d.id===t.id)return {ok:false,hint:"Nothing to move."};
  if(d.priority!==d.meritPriority)return {ok:false,hint:"A blocker lifted by a dependency cannot be dragged."};
  if(d.meritPriority!==t.meritPriority)return {ok:false,hint:HINT_CROSS};
  const rest=open.filter(e=>e.meritPriority===d.meritPriority).sort(byPos).map(e=>e.id).filter(x=>x!==d.id);
  rest.splice(rest.indexOf(t.id)+(after?1:0),0,d.id);
  return {ok:true,proposal:{band:d.meritPriority,order:rest}};
}
async function dropAndWrite(db,epicsIn,dragId,targetId,after,by,now){
  const p=dropProposal(epicsIn,dragId,targetId,after);
  if(!p.ok)return p;
  await db.doc("proposals/rank").set({band:p.proposal.band,order:p.proposal.order,by:str(by),at:str(now)});
  return p;
}
function renderBacklog(inp){
  const I=(inp&&typeof inp==="object")?inp:{};
  const admin=safe(()=>I.admin===true,false),canWrite=safe(()=>I.canWrite===true,false);
  const tOpt=safe(()=>({now:typeof I.now==="number"?I.now:Date.now(),locale:typeof I.locale==="string"?I.locale:undefined,timeZone:typeof I.timeZone==="string"?I.timeZone:undefined}),{});
  const F=safe(()=>normFilter(I.filter),normFilter(null)),filtered=filtering(F);
  const proj=safe(()=>projOf(I.project),projOf(null));
  const title=proj.name?proj.name+" Backlog":"Project Backlog";
  let skipped=0;const eps=[];
  safe(()=>{for(const d of arr(I.epics)){const e=normEpic(d);if(e)eps.push(e);else skipped++;}},0);
  const meta=safe(()=>(I.meta&&typeof I.meta==="object"&&!Array.isArray(I.meta))?I.meta:{},{});

  const ended=eps.filter(e=>e.status==="archived"),live=eps.filter(e=>e.status!=="archived");
  const marked=live.filter(e=>markOf(e.id)),open=live.filter(e=>!markOf(e.id)).sort(byPos);
  const index=new Map();open.forEach((e,i)=>{index.set(e.id,i);});
  const keyOf=new Map();eps.forEach(e=>{keyOf.set(e.id,e.key);});
  const hasCard=e=>!!(e.whyNow||e.description);
  const byEnd=(a,b)=>String(b.endedAt).localeCompare(String(a.endedAt))||String(a.id).localeCompare(String(b.id));
  const yes=ended.filter(e=>e.delivered===true).sort(byEnd),no=ended.filter(e=>e.delivered===false).sort(byEnd),unk=ended.filter(e=>e.delivered===null).sort(byEnd);
  const depName=d=>keyOf.get(d)||d;
  const parts={};
  parts.info=step("The page info",()=>{const i=I.info,o=(i&&typeof i==="object")?i:{};const w=when(str(o.lastUpdated),tOpt),a=when(str(o.asOf),tOpt);
    const pill=w.abs?`<div class="lastup">Last updated ${esc(w.abs)}${H(w.rel?`<span class="rel">· ${esc(w.rel)}</span>`:"")}</div>`:'<div class="lastup">Last updated: not yet refreshed</div>';
    return `${H(pill)}<p class="src">Engine export read ${esc(a.abs||"at an unknown time")}${H(str(o.head)?` · repo head <code>${esc(str(o.head))}</code>`:"")}</p>`;});
  parts.needs=step("The setup checklist",()=>{const n=[];
    if(!proj.name)n.push(need("project-name","No project name: the title reads \"Project Backlog\"","set-project --name \"<project name>\"",ASK_USER));
    if(!proj.key)n.push(need("project-key","No project key: epics show \"no key\" instead of a key such as PM-256","set-project --key <2 or 3 capital letters>",ASK_USER));
    else{const nokey=eps.filter(e=>!e.key).length;if(nokey)n.push(need("epic-numbers",num(nokey)+" epic"+(nokey===1?" has":"s have")+" no number, so no key","/pm:upgrade (numbers every epic that has none)","The agent runs it; no question for the user."));}
    const nosum=open.filter(e=>!e.summary);
    if(nosum.length)n.push(need("epic-summaries",num(nosum.length)+" open epic"+(nosum.length===1?" has":"s have")+" no one-line summary, so the Summary column shows the title","update-epic <id> --summary \"<one line>\"",AGENT_DRAFTS+" Ask in one batch."));
    return n.length?`<div class="needs" aria-label="Still to fill in"><p class="needs__h">Still to fill in. Each card names the command that sets it.</p>${H(n.join(""))}</div>`:"";});
  parts.counts=step("The counts",()=>{const t={};LEVELS.forEach(l=>{t[l]=0;});open.forEach(e=>{t[e.priority]+=1;});
    return `<div class="counts">${H(LEVELS.filter(l=>l!=="P?"||t[l]>0).map(l=>`<span class="count p-${esc(l)}"><i class="dot d-${esc(l)}"></i>${num(t[l])} ${esc(l)}</span>`).join(""))}<span class="count c-done">${num(yes.length)} delivered</span><span class="count">${num(no.length+marked.length)} not pursuing</span>${H(unk.length?`<span class="count">${num(unk.length)} outcome unknown</span>`:"")}</div>`;});
  parts.legend=step("The legend",()=>`<div class="legend">${H(["P0","P1","P2","P3"].map(l=>`<div><b><i class="dot d-${esc(l)}"></i>${esc(l)}</b>${esc(LEGEND[l])}</div>`).join(""))}</div>`);
  parts.filters=step("The filters",()=>{
    const uniq=xs=>xs.filter((x,i)=>x&&xs.indexOf(x)===i).sort();
    const chip=(f,v,on,label)=>`<button type="button" class="chip" data-f="${esc(f)}" data-v="${esc(v)}" aria-pressed="${H(on?"true":"false")}">${esc(label)}</button>`;
    const rels=uniq(open.map(e=>e.release));
    return `<div class="fbar" role="search"><label class="lbl" for="q">Find</label><div><input type="text" id="q" value="${esc(F.q)}" placeholder="Key, summary, title or release" autocomplete="off"></div>
<span class="lbl">Priority</span><div class="chips">${H(["P0","P1","P2","P3"].map(l=>chip("prio",l,F.prio.indexOf(l)>=0,l)).join(""))}</div>
<span class="lbl">Status</span><div class="chips">${H(uniq(open.map(e=>e.status)).map(s=>chip("status",s,F.status.indexOf(s)>=0,s)).join(""))}</div>
<label class="lbl" for="frel">Release</label><div><select id="frel"><option value="">Any release</option><option value="-"${H(F.release==="-"?" selected":"")}>No release</option>${H(rels.map(r=>`<option value="${esc(r)}"${H(F.release===r?" selected":"")}>${esc(r)}</option>`).join(""))}</select></div>
<span class="lbl">Lane</span><div class="chips">${H(uniq(open.map(e=>e.lane)).map(l=>chip("lane",l,F.lane.indexOf(l)>=0,l)).join(""))}</div></div>`;});
  parts.hint=step("The hint",()=>`<p class="hint" id="hint">${H(filtered?"Drag is off while a filter is on. Clear the filters to propose an order.":(admin?"Drag a row within its priority band to propose a new order. The agent applies it on the next refresh. Priority changes go through the agent.":"Only editors can propose an order. Contributors can set an epic aside as not pursuing."))}</p>`);
  const rowHtml=(e,first)=>{
    const lifted=e.priority!==e.meritPriority,drag=admin&&!lifted&&!filtered;
    const deps=e.dependsOn.map(d=>{const di=index.get(d);if(di===undefined)return `<span class="dep">Depends on ${esc(depName(d))}</span>`;
      const warn=di>index.get(e.id);
      return `<a class="dep${H(warn?" dep--warn":"")}" href="#card-${esc(d)}">${H(warn?"Ranked below: ":"Depends on ")}${esc(depName(d))}</a>`;}).join("");
    const np=canWrite?`<details class="np"><summary>Set aside</summary><div class="row"><select id="np-r-${esc(e.id)}" aria-label="Reason for setting ${esc(e.key||e.id)} aside">${H(REASONS.map(r=>`<option>${esc(r)}</option>`).join(""))}</select><input type="text" id="np-n-${esc(e.id)}" maxlength="200" placeholder="Note" aria-label="Note for ${esc(e.key||e.id)}"><button class="btn" type="button" data-notpursuing="${esc(e.id)}">Mark not pursuing</button></div></details>`:"";
    return `<tbody class="itm band-${esc(e.meritPriority)}${H(first?" first":"")}" data-id="${esc(e.id)}" data-band="${esc(e.meritPriority)}" draggable="${H(drag?"true":"false")}"><tr>
<td class="sp"><i class="d-${esc(e.priority)}"></i></td>
<td>${H(drag?`<button type="button" class="hd" aria-label="Drag to reorder ${esc(labelOf(e))}">&#8942;&#8942;</button>`:"")}</td>
<td class="rk">${num(index.get(e.id)+1)}</td>
<td>${H(hasCard(e)?`<a href="#card-${esc(e.id)}">${H(keyHtml(e))}</a>`:keyHtml(e))}<span class="slug">${esc(e.id)}</span></td>
<td><span class="pill p-${esc(e.priority)}">${esc(e.priority)}</span>${H(lifted?`<span class="tag">lifted from ${esc(e.meritPriority)}</span>`:"")}</td>
<td class="it">${H(e.summary?`<b>${esc(e.summary)}</b>`:`<b>${esc(e.title)}</b><span class="nosum">Title shown: no summary recorded</span>`)}${H(deps?`<div class="tags">${H(deps)}</div>`:"")}</td>
<td>${H(e.release?`<span class="tag">${esc(e.release)}</span>`:'<span class="s">none</span>')}</td>
<td><span class="st st-${esc(oneOf(e.status,STATUSES))}">${esc(e.status)}</span>${H(np)}</td>
<td>${H(whenHtml(e.updatedAt,tOpt,"unknown"))}</td></tr></tbody>`;};
  parts.rows=step("The ranked list",()=>{
    if(!open.length)return '<p class="empty">No open epics in the export. Ask the agent to refresh the board.</p>';
    const bands=LEVELS.filter(b=>open.some(e=>e.meritPriority===b));
    return `<div class="tblw"><table id="main"><thead><tr><th class="sp"></th><th></th><th>#</th><th>Key</th><th>Priority</th><th>Summary</th><th>Release</th><th>Status</th><th>Updated</th></tr></thead>${H(bands.map(b=>open.filter(e=>e.meritPriority===b).map((e,i)=>rowHtml(e,i===0)).join("")).join(""))}</table></div>`;});
  const cardHtml=e=>{
    const dd=(k,v)=>v?`<dt>${esc(k)}</dt><dd>${H(v)}</dd>`:"";
    const dl=[dd("Why now",esc(e.whyNow)),dd("Release",esc(e.release)),dd("Depends on",esc(e.dependsOn.map(depName).join(", "))),dd("Tracker",linkOrText(e.externalUrl)),dd("Updated",e.updatedAt?whenHtml(e.updatedAt,tOpt):"")];
    return `<article class="card" id="card-${esc(e.id)}"><div class="card__h">${H(keyHtml(e))}<span class="pill p-${esc(e.priority)}">${esc(e.priority)}</span><h3>${esc(e.title)}</h3><a class="back" href="#main">Back to list</a></div>
<div class="card__sub">${esc(e.status)} · ${esc(e.lane||"no lane")} · <span class="mono">${esc(e.id)}</span></div>
${H(e.summary?`<p>${esc(e.summary)}</p>`:"")}${H(e.description?`<p class="dt">${esc(e.description)}</p>`:"")}
<dl class="meta">${H(dl.join(""))}</dl></article>`;};
  parts.cards=step("The detail cards",()=>open.filter(hasCard).map(cardHtml).join(""));
  parts.delivered=step("The delivered table",()=>`<div class="tblw"><table class="tbl2"><thead><tr><th>Key</th><th>Summary</th><th>Where shipped</th><th>Ended</th><th>Note</th></tr></thead><tbody class="minor">${H(yes.length?yes.map(e=>`<tr><td>${H(keyHtml(e))}<span class="slug">${esc(e.id)}</span></td><td>${esc(labelOf(e))}</td><td><span class="done-tag">${esc(e.release||e.outcome||"delivered")}</span></td><td>${H(whenHtml(e.endedAt,tOpt))}</td><td>${esc(e.outcomeReason)}</td></tr>`).join(""):'<tr><td colspan="5" class="empty">Nothing delivered yet.</td></tr>')}</tbody></table></div>`);
  parts.gone=step("The not pursuing table",()=>{
    const a=marked.map(e=>{const m=markOf(e.id);return `<tr><td>${H(keyHtml(e))}<span class="slug">${esc(e.id)}</span></td><td>${esc(labelOf(e))}</td><td><b>${esc(m.reason)}</b> <span class="s">${esc(m.note)}</span></td><td><span class="s">set aside on this board</span></td><td>${H(canWrite?`<button class="btn" type="button" data-restore="${esc(e.id)}">Restore</button>`:"")}</td></tr>`;});
    const b=no.map(e=>`<tr><td>${H(keyHtml(e))}<span class="slug">${esc(e.id)}</span></td><td>${esc(labelOf(e))}</td><td><b>${esc(e.outcome)}</b> <span class="s">${esc(e.outcomeReason)}</span></td><td>${H(whenHtml(e.endedAt,tOpt))}</td><td></td></tr>`);
    return `<div class="tblw"><table class="tbl2"><thead><tr><th>Key</th><th>Summary</th><th>Outcome or reason</th><th>When</th><th></th></tr></thead><tbody>${H(a.concat(b).length?a.concat(b).join(""):'<tr><td colspan="5" class="empty">Nothing set aside.</td></tr>')}</tbody></table></div>`;});
  parts.unknown=step("The outcome unknown table",()=>unk.length?`<section class="sec"><h2>Outcome unknown</h2><p class="hint">These ended without a recorded outcome, so they are not counted as delivered.</p><div class="tblw"><table class="tbl2"><thead><tr><th>Key</th><th>Summary</th><th>Ended</th></tr></thead><tbody>${H(unk.map(e=>`<tr><td>${H(keyHtml(e))}<span class="slug">${esc(e.id)}</span></td><td>${esc(labelOf(e))}</td><td>${H(whenHtml(e.endedAt,tOpt))}</td></tr>`).join(""))}</tbody></table></div></section>`:"");
  parts.skipped=skippedNote(skipped);
  const html=[parts.skipped,parts.info,parts.needs,parts.counts,parts.legend,parts.filters,
    '<section class="sec" aria-labelledby="h-epics"><h2 id="h-epics">Epics</h2>',parts.hint,parts.rows,'</section>',
    parts.cards?'<section class="sec"><h2>Epic details</h2><div class="cards">'+parts.cards+'</div></section>':"",
    '<section class="sec"><h2>Delivered</h2>'+parts.delivered+'</section>','<section class="sec"><h2>Not pursuing</h2>'+parts.gone+'</section>',parts.unknown].join("");
  return {skipped,parts,html,title};
}
function fromSnapshot(s){
  const o=(s&&typeof s==="object")?s:{};
  return {epics:arr(o.epics),releases:arr(o.releases),meta:{},project:(o.project&&typeof o.project==="object")?o.project:null,
    info:{lastUpdated:str(o.asOf),asOf:str(o.asOf),head:str(o.head)},admin:false,canWrite:false};
}
/* pm:render-end */
const app=document.getElementById("app");
app.innerHTML='<div class="wrap"><div class="top"><div><h1 id="ttl">Project Backlog</h1><p class="lede">Open epics in the order the engine ranks them, banded by merit priority. Drag proposes an order; the agent applies it.</p></div><div class="live" id="live" data-s="busy" role="status"><i></i><span>Connecting…</span></div></div><div id="body"></div></div>';
const liveEl=document.getElementById("live"),bodyEl=document.getElementById("body"),ttlEl=document.getElementById("ttl");
const setLive=(s,t)=>{liveEl.dataset.s=s;liveEl.querySelector("span").textContent=t;};
const S={epics:[],meta:Object.create(null),info:{},ready:false,standalone:false};
const F={q:"",prio:[],status:[],release:"",lane:[]};
let db=null,me="",admin=false,canWrite=false,pending=false,hintMsg="";
const withId=snap=>snap.docs.map(x=>Object.assign({},x.data(),{id:x.id}));
function applyFilter(){
  const on=filtering(F),byId=new Map();
  S.epics.forEach(d=>{const e=normEpic(d);if(e)byId.set(e.id,e);});
  bodyEl.querySelectorAll("tbody.itm[data-id]").forEach(b=>{const e=byId.get(b.getAttribute("data-id"));b.hidden=!!(e&&!matches(e,F));
    if(on)b.setAttribute("draggable","false");});
  const h=document.getElementById("hint");if(h&&on)h.textContent="Drag is off while a filter is on. Clear the filters to propose an order.";
}
function paint(){
  if(!S.ready)return;
  const a=document.activeElement;
  if(a&&bodyEl.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){pending=true;return;}
  pending=false;
  const open=new Set();bodyEl.querySelectorAll("details.np[open]").forEach(d=>{const b=d.closest("tbody[data-id]");if(b)open.add(b.getAttribute("data-id"));});
  const out=renderBacklog({epics:S.epics,releases:[],meta:S.meta,info:S.info,project:S.info&&S.info.project,filter:F,admin:admin&&!S.standalone,canWrite:canWrite&&!S.standalone});
  bodyEl.innerHTML=out.html;ttlEl.textContent=out.title;document.title=out.title;
  bodyEl.querySelectorAll("tbody[data-id]").forEach(b=>{if(open.has(b.getAttribute("data-id"))){const d=b.querySelector("details.np");if(d)d.open=true;}});
  if(S.standalone)bodyEl.insertAdjacentHTML("afterbegin",'<div class="notice">Read-only copy. Editing needs the live version of this board.</div>');
  const h=document.getElementById("hint");if(h&&hintMsg&&!filtering(F))h.textContent=hintMsg;
  applyFilter();
}
bodyEl.addEventListener("focusout",()=>{if(pending)setTimeout(paint,0);});
bodyEl.addEventListener("input",e=>{if(e.target&&e.target.id==="q"){F.q=e.target.value;applyFilter();}});
bodyEl.addEventListener("change",e=>{if(e.target&&e.target.id==="frel"){F.release=e.target.value;applyFilter();}});
async function put(path,data){try{await db.doc(path).set(data);}catch(e){setLive("err",e&&e.code==="invalid_argument"?"Your access level cannot save this.":"A change did not save. Reload and try again.");}}
bodyEl.addEventListener("click",e=>{
  const c=e.target.closest?e.target.closest("[data-f]"):null;
  if(c){const f=c.getAttribute("data-f"),v=c.getAttribute("data-v");if(Array.isArray(F[f])){const i=F[f].indexOf(v);if(i>=0)F[f].splice(i,1);else F[f].push(v);c.setAttribute("aria-pressed",i>=0?"false":"true");applyFilter();}return;}
  if(!db||S.standalone)return;
  const t=e.target.closest?e.target.closest("[data-notpursuing],[data-restore]"):null;if(!t)return;
  const np=t.getAttribute("data-notpursuing"),rs=t.getAttribute("data-restore");
  if(np&&okId(np)){const r=document.getElementById("np-r-"+np),n=document.getElementById("np-n-"+np);
    put("backlogMeta/"+np,{removed:true,reason:r?r.value:"",note:n?n.value.slice(0,200):""});}
  else if(rs&&okId(rs))put("backlogMeta/"+rs,{removed:false,reason:"",note:""});
});
let dragId=null;
const rowOf=e=>e.target.closest?e.target.closest("tbody[data-id]"):null;
const lower=(e,b)=>{const r=b.getBoundingClientRect();return e.clientY>r.top+r.height/2;};
bodyEl.addEventListener("dragstart",e=>{const b=rowOf(e);if(!b||!db||!admin||filtering(F)||b.getAttribute("draggable")!=="true"){e.preventDefault();return;}
  dragId=b.getAttribute("data-id");b.classList.add("drag");try{e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",dragId);}catch(_){}});
bodyEl.addEventListener("dragover",e=>{if(!dragId)return;e.preventDefault();bodyEl.querySelectorAll(".over").forEach(r=>r.classList.remove("over"));const b=rowOf(e);if(b&&b.getAttribute("data-id")!==dragId)b.classList.add("over");});
bodyEl.addEventListener("dragend",()=>{dragId=null;bodyEl.querySelectorAll(".drag,.over").forEach(r=>r.classList.remove("drag","over"));});
bodyEl.addEventListener("drop",async e=>{e.preventDefault();const b=rowOf(e),id=dragId;dragId=null;if(!id||!b||!db)return;
  try{const r=await dropAndWrite(db,S.epics,id,b.getAttribute("data-id"),lower(e,b),me,new Date().toISOString());
    hintMsg=r.ok?"Order proposed for band "+r.proposal.band+". The agent applies it on the next refresh.":r.hint;}
  catch(err){hintMsg="The proposal did not save. Reload and try again.";}
  paint();});
(async()=>{
  const use=window.claude&&window.claude.use?n=>window.claude.use(n).catch(()=>null):()=>Promise.resolve(null);
  const [d,u]=await Promise.all([use("db"),use("user")]);
  db=d;
  if(!db){
    let snap=null;try{snap=JSON.parse(document.getElementById("pm-snapshot").textContent);}catch(_){}
    if(snap&&typeof snap==="object"){const m=fromSnapshot(snap);S.epics=m.epics;S.info=Object.assign({},m.info,{project:m.project});S.standalone=true;S.ready=true;setLive("ok","Read-only copy");paint();}
    else{setLive("err","Not connected");bodyEl.innerHTML='<div class="msg">Open this page signed in to claude.ai to see the backlog.</div>';}
    return;
  }
  if(u){try{me=await u.id();}catch(_){me="";}admin=safe(()=>u.canEdit()===true,false);canWrite=safe(()=>u.can("data.write")!==false,true);}
  let got=0;const ready=()=>{if(++got>=3){S.ready=true;setLive("ok","Live");}paint();};
  const fail=e=>setLive("err",e&&e.code==="revoked"?"Access changed. Reload the page.":"Lost the connection. Reload the page.");
  db.collection("epics").onSnapshot(s=>{S.epics=withId(s);ready();},fail);
  db.collection("backlogMeta").onSnapshot(s=>{const m=Object.create(null);s.docs.forEach(x=>{m[x.id]=x.data();});S.meta=m;ready();},fail);
  db.collection("page").onSnapshot(s=>{const i=s.docs.find(x=>x.id==="info");S.info=i?i.data():{};ready();},fail);
})();
})();
</script>
