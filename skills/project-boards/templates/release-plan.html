<title>Release Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a header, a summary band, then the board; one column at phone width. Data lives in the artifact db. */
:root{
  --bg:#F5F6F4; --surface:#FFFFFF; --fg:#1B2321; --muted:#5B6764; --line:#D9DEDB; --soft:#ECEFED;
  --accent:#1D5C54; --accent-fg:#FFFFFF; --focus:#2A8A7E; --warn-bg:#FFF1D6; --warn-fg:#7A4B00; --err-fg:#9B1C14;
  --p0-bg:#FBE3E1; --p0-fg:#9B1C14; --p1-bg:#FDEBD9; --p1-fg:#8A4300; --p2-bg:#FBF3CF; --p2-fg:#6B5600;
  --p3-bg:#E5ECF3; --p3-fg:#2F4A63; --pq-bg:#E7E9E8; --pq-fg:#4A5552; --done-bg:#DFF1E6; --done-fg:#1C5E37;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101615; --surface:#171F1D; --fg:#E2EAE7; --muted:#9BAAA6; --line:#2A3835; --soft:#1E2927;
  --accent:#6CC4B8; --accent-fg:#06201C; --focus:#86D6CB; --warn-bg:#3D2C0C; --warn-fg:#FFD27A; --err-fg:#FFB4AB;
  --p0-bg:#4A1A16; --p0-fg:#FFB4AB; --p1-bg:#47290C; --p1-fg:#FFC58C; --p2-bg:#3D340B; --p2-fg:#F3DA6B;
  --p3-bg:#1E2D3B; --p3-fg:#AFC6DC; --pq-bg:#27302E; --pq-fg:#B4C0BC; --done-bg:#163824; --done-fg:#9BE0B5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101615; --surface:#171F1D; --fg:#E2EAE7; --muted:#9BAAA6; --line:#2A3835; --soft:#1E2927;
  --accent:#6CC4B8; --accent-fg:#06201C; --focus:#86D6CB; --warn-bg:#3D2C0C; --warn-fg:#FFD27A; --err-fg:#FFB4AB;
  --p0-bg:#4A1A16; --p0-fg:#FFB4AB; --p1-bg:#47290C; --p1-fg:#FFC58C; --p2-bg:#3D340B; --p2-fg:#F3DA6B;
  --p3-bg:#1E2D3B; --p3-fg:#AFC6DC; --pq-bg:#27302E; --pq-fg:#B4C0BC; --done-bg:#163824; --done-fg:#9BE0B5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px 56px}
h1{font:650 28px/1.15 var(--body);margin:0;text-wrap:balance}
h2{font:650 20px/1.2 var(--body);margin:0 0 12px;text-wrap:balance}
h3{font:600 16px/1.3 var(--body);margin:0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.lede{color:var(--muted);margin:6px 0 0;max-width:68ch}
.live{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.live[data-s="ok"] i{background:var(--done-fg)}.live[data-s="err"] i{background:var(--err-fg)}
.counts{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0}
.count{padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--soft);color:var(--fg)}
.c-done{background:var(--done-bg);color:var(--done-fg)}
.hint,.src,.s{font-size:13px;color:var(--muted)}
.hint{margin:14px 0 8px}
.tblw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px;border-bottom:1px solid var(--line);background:var(--soft)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px;min-width:0}
tbody.band th{text-transform:none;letter-spacing:0;font-size:13px;color:var(--fg)}
tbody.itm.drag{opacity:.4}
tbody.itm.over td{box-shadow:inset 0 2px 0 var(--accent)}
.hd{cursor:grab;color:var(--muted);user-select:none;font-size:16px;line-height:1;padding:2px 4px;border-radius:4px;background:none;border:0}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.p-P0{background:var(--p0-bg);color:var(--p0-fg)}.p-P1{background:var(--p1-bg);color:var(--p1-fg)}.p-P2{background:var(--p2-bg);color:var(--p2-fg)}
.p-P3{background:var(--p3-bg);color:var(--p3-fg)}.p-P\?{background:var(--pq-bg);color:var(--pq-fg)}
.count.p-P0,.count.p-P1,.count.p-P2,.count.p-P3,.count.p-P\?{font-weight:600}
.tag,.dep{font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--soft);color:var(--muted);text-decoration:none;white-space:nowrap;margin-left:4px}
.dep--warn{background:var(--warn-bg);color:var(--warn-fg)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.it b{display:block;font-weight:600;overflow-wrap:anywhere}
.s{display:block;overflow-wrap:anywhere}
.st{font-size:12.5px;font-weight:600;white-space:nowrap}
.st-blocked{color:var(--err-fg)}.st-active{color:var(--accent)}
code,.mono{font:500 13px var(--mono)}
a{color:var(--accent)}
:is(button,select,a,input,textarea):focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sec{margin-top:36px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.card:target{outline:2px solid var(--accent)}
.card__h{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card p{margin:8px 0 0;overflow-wrap:anywhere}
.meta{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;margin:10px 0 0;font-size:13.5px}
.meta dt{color:var(--muted);font-weight:600}.meta dd{margin:0;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.btn,select,textarea,input[type="text"]{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:5px 10px;font:600 13px var(--body)}
.btn{cursor:pointer}.btn--p{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
textarea{width:100%;min-height:56px;font-weight:400;resize:vertical}
.empty{padding:18px;color:var(--muted);text-align:center}
.notice{background:var(--warn-bg);color:var(--warn-fg);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:13.5px}
.warn{background:var(--warn-bg);color:var(--warn-fg);border-radius:8px;padding:8px 12px;margin:12px 0;font-size:13.5px}
.banner,.mission{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-top:16px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.rel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:12px}
.rel--here{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.rel__h{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rs-planned{background:var(--p3-bg);color:var(--p3-fg)}.rs-in-progress{background:var(--p1-bg);color:var(--p1-fg)}.rs-shipped{background:var(--done-bg);color:var(--done-fg)}.rs-other{background:var(--pq-bg);color:var(--pq-fg)}
.list{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.list li{font-size:13.5px;background:var(--soft);border-radius:6px;padding:8px 10px;overflow-wrap:anywhere}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;color:var(--muted);margin-top:18px}
@media (max-width:640px){h1{font-size:24px}.meta{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div id="app"></div>
<script type="application/json" id="pm-snapshot">null</script>
<script>
(function(){
"use strict";
/* pm:render-begin */
const ID_RE=/^[A-Za-z0-9._-]+$/;
const LEVELS=["P0","P1","P2","P3","P?"];
const STATUSES=["untriaged","queued","active","paused","later","blocked","planned","archived"];
const RSTATUS=["planned","in-progress","shipped"];
const esc=s=>String(s==null?"":s).replace(/[&<>"'`]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;","`":"&#96;"})[c]);
const num=x=>(typeof x==="number"&&isFinite(x))?String(x):"0";
const H=x=>String(x);
const str=x=>typeof x==="string"?x:"";
const arr=x=>Array.isArray(x)?x:[];
const okId=x=>typeof x==="string"&&ID_RE.test(x);
const safeUrl=u=>(typeof u==="string"&&/^https?:\/\/[^\s"'<>`\\]+$/i.test(u))?u:"";
const prioOf=p=>(typeof p==="string"&&LEVELS.indexOf(p)>=0)?p:"P?";
const oneOf=(x,list)=>(typeof x==="string"&&list.indexOf(x)>=0)?x:"other";
const inlineJson=v=>{const j=JSON.stringify(v);return (j===undefined?"null":j).replace(/</g,"\\u003c");};
const safe=(fn,dflt)=>{try{return fn();}catch(_){return dflt;}};
const step=(label,fn)=>{try{return String(fn());}catch(_){return '<div class="notice" role="status">'+esc(label)+' could not be drawn. The rest of the board is unaffected.</div>';}};
const byPos=(a,b)=>{const pa=a.position==null?1e15:a.position,pb=b.position==null?1e15:b.position;return pa-pb||String(a.id).localeCompare(String(b.id));};
function normEpic(d){
  try{
    if(!d||typeof d!=="object"||Array.isArray(d)||!okId(d.id))return null;
    const n=v=>(typeof v==="number"&&isFinite(v))?v:null;
    return {id:d.id,title:str(d.title),summary:str(d.summary),whyNow:str(d.whyNow),description:str(d.description),lane:str(d.lane),
      status:str(d.status),priority:prioOf(d.priority),meritPriority:prioOf(d.meritPriority),position:n(d.position),
      release:okId(d.release)?d.release:"",externalUrl:str(d.externalUrl),dependsOn:arr(d.dependsOn).filter(okId),
      delivered:d.delivered===true?true:(d.delivered===false?false:null),outcome:str(d.outcome),outcomeReason:str(d.outcomeReason),endedAt:str(d.endedAt)};
  }catch(_){return null;}
}
const skippedNote=n=>n>0?`<p class="hint">Skipped ${num(n)} record${H(n===1?"":"s")} with an unusable id or shape.</p>`:"";
const linkOrText=raw=>{const u=safeUrl(raw);return u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>`:esc(str(raw));};
const RELSTAT_LABEL={"planned":"planned","in-progress":"in progress","shipped":"shipped"};
function renderPlan(inp){
  const I=(inp&&typeof inp==="object")?inp:{};
  const canWrite=safe(()=>I.canWrite===true,false);
  const nowMs=safe(()=>(typeof I.now==="number"?I.now:Date.now()),Date.now());
  let skipped=0;const eps=[];
  safe(()=>{for(const d of arr(I.epics)){const e=normEpic(d);if(e)eps.push(e);else skipped++;}},0);
  const plan=safe(()=>(I.plan&&typeof I.plan==="object")?I.plan:{},{});
  const here=safe(()=>okId(plan.here)?plan.here:"","");
  const parts={};
  parts.banner=step("The banner",()=>{
    const t=Date.parse(str(plan.asOf)),days=isFinite(t)?Math.floor((nowMs-t)/864e5):null;
    return `<div class="banner"><span class="lbl">We are here</span><p>${esc(str(plan.hereText)||(here?"Release "+here:"Not set"))}</p><p class="s">Next: ${esc(str(plan.nextText)||"not set")} · head ${esc(str(plan.head))} · export ${esc(str(plan.asOf))}</p></div>${H(days!==null&&days>=2?`<p class="warn">Stale: this board was last refreshed ${num(days)} days ago. Ask the agent to refresh it.</p>`:"")}`;});
  parts.mission=step("The mission",()=>{const m=(I.mission&&typeof I.mission==="object")?I.mission:null;
    if(!m||!str(m.statement))return '<div class="mission"><span class="lbl">Mission</span><p class="s">No mission recorded.</p></div>';
    return `<div class="mission"><span class="lbl">Mission</span><p>${esc(str(m.statement))}</p><p class="s">Mission milestone: ${esc(okId(m.milestoneRelease)?m.milestoneRelease:"none")} · set ${esc(str(m.setAt))} · ${esc(str(m.reason))}</p></div>`;});
  parts.counts=step("The counts",()=>{const open=eps.filter(e=>e.status!=="archived").length;
    return `<div class="counts"><span class="count">${num(open)} open epics</span><span class="count">${num(eps.length-open)} ended in the export</span><span class="count">${num(arr(I.releases).length)} releases</span></div>`;});
  parts.roadmap=step("The roadmap",()=>{
    const rels=[];
    arr(I.releases).forEach(d=>{
      if(!d||typeof d!=="object"||!okId(d.id)){skipped++;return;}
      rels.push({id:d.id,intent:str(d.intent),theme:str(d.theme),rationale:str(d.rationale),exit:str(d.exit),size:str(d.size),
        order:(typeof d.order==="number"&&isFinite(d.order))?d.order:null,status:str(d.status),critical:d.criticalPath===true});});
    rels.sort((a,b)=>{const x=a.order==null?1e15:a.order,y=b.order==null?1e15:b.order;return x-y||String(a.id).localeCompare(String(b.id));});
    const epicLi=e=>`<li data-epic="${esc(e.id)}"><span class="mono">${esc(e.id)}</span> <span class="pill p-${esc(e.priority)}">${esc(e.priority)}</span> ${esc(e.title)} <span class="st st-${esc(oneOf(e.status,STATUSES))}">${esc(e.status)}</span> ${H(linkOrText(e.externalUrl))}</li>`;
    const known=new Set(rels.map(r=>r.id));
    const relHtml=r=>`<section class="rel${H(r.id===here?" rel--here":"")}" data-release="${esc(r.id)}"><div class="rel__h"><h3>${esc(r.id)}</h3><span class="pill rs-${esc(oneOf(r.status,RSTATUS))}">${esc(r.status)}</span>${H(r.id===here?'<span class="tag">we are here</span>':"")}${H(r.critical?'<span class="tag">critical path</span>':"")}<span class="s">${esc(r.theme)}</span></div>
<p class="s">${esc(r.intent)}</p>${H(r.rationale?`<p>${esc(r.rationale)}</p>`:"")}${H(r.exit?`<p class="s">Exit: ${esc(r.exit)}</p>`:"")}${H(r.size?`<p class="s">Size: ${esc(r.size)}</p>`:"")}
<ul class="list">${H(eps.filter(e=>e.release===r.id).sort(byPos).map(epicLi).join(""))}</ul></section>`;
    const loose=eps.filter(e=>!known.has(e.release));
    return rels.map(relHtml).join("")+(loose.length?`<section class="rel"><div class="rel__h"><h3>Not in a release</h3></div><ul class="list">${H(loose.sort(byPos).map(epicLi).join(""))}</ul></section>`:"");});
  parts.criteria=step("The exit criteria",()=>{const cs=[];
    arr(I.criteria).forEach(d=>{if(d&&typeof d==="object"&&okId(d.id))cs.push(d);else skipped++;});
    cs.sort((a,b)=>String(a.id).localeCompare(String(b.id),undefined,{numeric:true}));
    return cs.length?`<ul class="list">${H(cs.map(c=>`<li data-criterion="${esc(c.id)}"><b>${esc(str(c.text))}</b> <span class="s">Check: ${esc(str(c.check))}</span>${H(c.needsHuman===true?'<span class="tag">needs a person</span>':"")}</li>`).join(""))}</ul>`:'<p class="empty">No exit criteria recorded.</p>';});
  parts.decisions=step("The decisions",()=>{
    const answered=new Map();arr(I.answers).forEach(a=>{if(a&&typeof a==="object"&&okId(a.id))answered.set(a.id,a);});
    const ds=[];arr(I.decisions).forEach(d=>{if(d&&typeof d==="object"&&okId(d.id))ds.push(d);else skipped++;});
    ds.sort((a,b)=>String(a.id).localeCompare(String(b.id),undefined,{numeric:true}));
    if(!ds.length)return '<p class="empty">No open questions.</p>';
    return `<ul class="list">${H(ds.map(d=>{const a=answered.get(d.id),st=a?oneOf(a.stance,["agree","disagree"]):"other";
      return `<li data-decision="${esc(d.id)}"><b>${esc(str(d.question))}</b><span class="s">Recommendation: ${esc(str(d.recommendation))}</span><span class="s">asked by the agent · ${esc(str(d.askedAt))}</span>${H(st!=="other"?`<span class="s">Answer: ${esc(st)}</span>`:"")}${H(canWrite?`<div class="row"><button class="btn" type="button" data-answer="${esc(d.id)}" data-stance="agree">Agree</button><button class="btn" type="button" data-answer="${esc(d.id)}" data-stance="disagree">Disagree</button><textarea id="ans-${esc(d.id)}" maxlength="1000" placeholder="Note" aria-label="Note on question ${esc(d.id)}"></textarea></div>`:"")}</li>`;}).join(""))}</ul>${H(canWrite?'<div class="row"><button class="btn btn--p" type="button" id="send-answers">Send my answers</button></div>':"")}`;});
  parts.skipped=skippedNote(skipped);
  const html=[parts.skipped,parts.banner,parts.mission,parts.counts,'<section class="sec"><h2>Roadmap</h2>'+parts.roadmap+'</section>','<section class="sec"><h2>Exit criteria</h2>'+parts.criteria+'</section>','<section class="sec"><h2>Open questions</h2>'+parts.decisions+'</section>'].join("");
  return {skipped,parts,html};
}
function fromSnapshot(s){
  const o=(s&&typeof s==="object")?s:{},pl=(o.plan&&typeof o.plan==="object")?o.plan:{},ms=(o.milestone&&typeof o.milestone==="object")?o.milestone:null,mi=(o.mission&&typeof o.mission==="object")?o.mission:null;
  return {epics:arr(o.epics),releases:arr(o.releases),
    plan:{here:pl.here,hereText:pl.hereText,nextText:pl.nextText,head:str(o.head),asOf:str(o.asOf)},
    mission:mi?{statement:mi.statement,setAt:mi.setAt,reason:mi.reason,milestoneRelease:ms?ms.release:null}:null,
    criteria:ms?arr(ms.criteria):[],decisions:[],answers:[],info:{},admin:false,canWrite:false};
}
/* pm:render-end */
const app=document.getElementById("app");
app.innerHTML='<div class="wrap"><div class="top"><div><h1>Release Plan</h1><p class="lede">Where the project stands against its mission, release by release. The agent refreshes this board from the engine export.</p></div><div class="live" id="live" data-s="busy" role="status"><i></i><span>Connecting…</span></div></div><div id="body"></div></div>';
const liveEl=document.getElementById("live"),bodyEl=document.getElementById("body");
const setLive=(s,t)=>{liveEl.dataset.s=s;liveEl.querySelector("span").textContent=t;};
const C=["epics","releases","plan","mission","criteria","decisions","answers","page"];
const S={ready:false,standalone:false,snap:null};
C.forEach(k=>{S[k]=[];});
let db=null,me="",canWrite=false,pending=false;
const withId=snap=>snap.docs.map(x=>Object.assign({},x.data(),{id:x.id}));
const docOf=(list,id)=>{const d=list.find(x=>x.id===id);return d||null;};
function paint(){
  if(!S.ready)return;
  const a=document.activeElement;
  if(a&&bodyEl.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){pending=true;return;}
  pending=false;
  const input=S.standalone?fromSnapshot(S.snap):{epics:S.epics,releases:S.releases,plan:docOf(S.plan,"state")||{},mission:docOf(S.mission,"current"),criteria:S.criteria,decisions:S.decisions,answers:S.answers,info:docOf(S.page,"info")||{},canWrite:canWrite};
  bodyEl.innerHTML=renderPlan(input).html;
  if(S.standalone)bodyEl.insertAdjacentHTML("afterbegin",'<div class="notice">Read-only copy. Editing and answering need the live version of this board.</div>');
}
bodyEl.addEventListener("focusout",()=>{if(pending)setTimeout(paint,0);});
async function put(path,data){try{await db.doc(path).set(data);return true;}catch(e){setLive("err",e&&e.code==="invalid_argument"?"Your access level cannot save answers.":"An answer did not save. Reload and try again.");return false;}}
bodyEl.addEventListener("click",async e=>{
  if(!db||S.standalone||!e.target.closest)return;
  const b=e.target.closest("[data-answer],#send-answers");if(!b)return;
  const at=new Date().toISOString();
  if(b.id==="send-answers"){if(await put("answers/_submitted",{by:me,at}))setLive("ok","Answers sent");return;}
  const id=b.getAttribute("data-answer"),st=b.getAttribute("data-stance");
  if(!okId(id)||(st!=="agree"&&st!=="disagree"))return;
  const n=document.getElementById("ans-"+id);
  await put("answers/"+id,{decision:id,stance:st,note:n?n.value.slice(0,1000):"",by:me,at});
});
(async()=>{
  const use=window.claude&&window.claude.use?n=>window.claude.use(n).catch(()=>null):()=>Promise.resolve(null);
  const [d,u]=await Promise.all([use("db"),use("user")]);
  db=d;
  if(!db){
    let snap=null;try{snap=JSON.parse(document.getElementById("pm-snapshot").textContent);}catch(_){}
    if(snap&&typeof snap==="object"){S.snap=snap;S.standalone=true;S.ready=true;setLive("ok","Read-only copy");paint();}
    else{setLive("err","Not connected");bodyEl.innerHTML='<div class="msg">Open this page signed in to claude.ai to see the release plan.</div>';}
    return;
  }
  if(u){try{me=await u.id();}catch(_){me="";}canWrite=safe(()=>u.can("data.write")!==false,true);}
  let got=0;const ready=()=>{if(++got>=C.length){S.ready=true;setLive("ok","Live");}paint();};
  const fail=e=>setLive("err",e&&e.code==="revoked"?"Access changed. Reload the page.":"Lost the connection. Reload the page.");
  C.forEach(k=>{let first=true;db.collection(k).onSnapshot(s=>{S[k]=withId(s);if(first){first=false;ready();}else paint();},fail);});
})();
})();
</script>
