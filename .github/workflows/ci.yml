name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'openspec/**', '.conductor/**']
  # NO paths-ignore on pull_request: branch protection requires the aggregate `test` check, and a
  # workflow skipped by a path filter never reports it — a docs-only PR could then not merge at all,
  # not even with --admin (#236, hit by #235). Push-to-main keeps its filter; every PR runs.
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # THE COMMITTED FALLBACK (0.49.0, design D2) — the Node majors CI tests when the release schedule
  # cannot be fetched. It is also the ONE list that ties the schedule to the engine: its minimum must
  # equal NODE_FLOOR_MAJOR in scripts/lib/runtime-support.mjs (asserted per commit by
  # scripts/test/assert/ci-workflow.test.mjs), and whenever the schedule IS fetched the computed set
  # must equal it (asserted here, by scripts/test/node-majors.mjs). So a line reaching end-of-life
  # turns this workflow red until one release moves the fallback, the constant and the documented
  # support floor together — deliberately (decided 2026-09-24: disagreement FAILS CI).
  PM_NODE_FALLBACK: "[22,24,26]"

jobs:
  # ─────────── THE SUPPORTED MAJORS, COMPUTED (0.49.0, design D2) ───────────
  # pm supports, and CI tests, exactly the Node LTS lines that are not end-of-life: a schedule entry
  # with an `lts` date, `start <= today < end` (UTC). The set is COMPUTED here from Node's own
  # release schedule, never typed. The fetch is the only network step and it stays in this workflow;
  # every decision is scripts/test/node-majors.mjs's, which the per-commit suite tests clause by clause:
  #   * the fetch fails        -> the committed fallback, with a ::warning:: on the run and its summary;
  #   * the body is unreadable -> ::error::, never the fallback (that is for an unreachable host);
  #   * computed != fallback   -> ::error:: naming both;
  #   * an empty set           -> ::error::.
  node-majors:
    name: node-majors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      majors: ${{ steps.compute.outputs.majors }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js (the support floor)
        # The script runs on a SUPPORTED Node: the fallback's first entry, which the per-commit guard
        # holds equal to the support floor.
        uses: actions/setup-node@v7
        with:
          node-version: ${{ fromJSON(env.PM_NODE_FALLBACK)[0] }}

      - name: Compute the supported majors
        id: compute
        run: |
          set -e
          if curl -fsSL --retry 3 --max-time 30 -o /tmp/schedule.json https://raw.githubusercontent.com/nodejs/Release/main/schedule.json; then
            node scripts/test/node-majors.mjs --schedule /tmp/schedule.json --today "$(date -u +%F)" --fallback "$PM_NODE_FALLBACK" --output "$GITHUB_OUTPUT"
          else
            node scripts/test/node-majors.mjs --fetch-failed --today "$(date -u +%F)" --fallback "$PM_NODE_FALLBACK" --output "$GITHUB_OUTPUT"
          fi

  # ─────────── ONE LEG PER SUPPORTED MAJOR ───────────
  # `fail-fast: false`, so a failure names EVERY major it occurs on rather than cancelling the rest.
  # `timeout-minutes` is the backstop for a hung synchronous spawn (design D9 bounds only the awaited
  # ones). Each leg reports as `test (node N)`; the required check is the aggregate below.
  test-node:
    name: test (node ${{ matrix.node }})
    needs: node-majors
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.node-majors.outputs.majors) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, not the default shallow clone. Several integrity tests are evaluated
          # against THIS repository's real git history (`git merge-base --is-ancestor` on real
          # hashes) precisely so they cannot pass vacuously against a synthetic temp repo. Under
          # `fetch-depth: 1` git has never seen those commits, `isAncestor` answers `null`, and
          # the assertions fail in CI while passing locally.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # ─────────── THE THREE BUCKETS (6.5) ───────────
      #
      # THIS IS THE ONE PLACE THE FUNCTIONAL HALF AND THE SWEEP BUCKET RUN. The pre-commit hook runs
      # the assertion half and the drift script and deliberately does NOT run either triggered bucket;
      # CI is the other half of that answer, and it is where the certification record is ABSENT and
      # cannot be substituted for a run (a fresh clone has no record — that is correct behaviour, and
      # the reason the drift script's refusal names this run instead of starting it).
      #
      # EACH BUCKET'S FLOOR IS ENUMERATED FROM THAT BUCKET'S OWN TRACKED FILES, which is the one
      # invariant the floor holds (design D8): what it compares is what the runner RAN against what
      # the runner was GIVEN, never against a superset. Enumerating both halves at once here is the
      # shape the invariant forbids — it aborts on every commit that has a functional half at all.
      # `git ls-files` rather than the shell's expansion of the runner's own pattern, so a glob that
      # stopped matching a file reports FEWER tests than the half declares and fires.
      #
      # EACH STEP'S STATUS IS THE RUNNER'S STATUS (Gate 2, G-C1), and it is written that way rather
      # than left to a pipeline's. Every bucket step used to be
      # `total=$(node --test … 2>&1 | tee /tmp/x.out | grep -m1 … | awk …)`: the step's status was
      # `awk`'s, so a FAILING suite reported `ran N, declared N-1`, satisfied the floor, and exited 0.
      # `set -e` does not trap it — `set -e` reads the status of the whole PIPELINE, which is its last
      # command. Proven: one deliberately failing assert file → `assertion half: ran 1238, declared
      # 1237`, `STEP EXIT=0`. The runner therefore writes to a file and its status is gated on
      # EXPLICITLY, before any count is parsed: a bucket that ran and failed cannot be read as one
      # that ran and passed. `set -o pipefail` would also work; the explicit gate is used because it
      # also puts the failing output in the log, and because `grep -m1` closing the pipe early would
      # otherwise make a PASSING suite's `tee` a status source too.
      #
      # ONE REPORTER, NO COLOUR, ONE PARSE, AND A COUNT THAT MUST BE READ (0.49.0, design D4). Every
      # runner is `FORCE_COLOR=0 node --test --test-reporter=spec …`: the default reporter differs by
      # major (TAP on 22, spec on 24 and 26) and a forced colour breaks the `^ℹ` anchor, so the reporter
      # and the colour are both fixed and only `ℹ` is parsed. Then, in order: an unreadable count fails;
      # the floor (`total < declared`) fails naming both counts; and a run of ZERO tests fails on its
      # own, whatever `declared` says — `[ "$total" -lt "$declared" ]` alone is green at 0/0.

      - name: Syntax check
        # RE-POINTED WITH THE SPLIT (5.3), in the same commit as the first file that leaves
        # `scripts/test/*.test.mjs`. The `for` loop does NOT descend a directory, so the moment a
        # file moved under `scripts/test/assert/` or `scripts/test/functional/` it stopped being
        # syntax-checked entirely — a class of error that reaches a green suite as a runtime throw.
        # `scripts/test/*.mjs` and `scripts/test/fixtures/*.mjs` are named too: the drift script, the
        # certify runner, the shared machinery, the fixtures and the two harnesses are not tests and
        # were never in the old glob, but a syntax error in any of them breaks a half (6.5).
        run: |
          node -c scripts/conductor.mjs
          for f in scripts/lib/*.mjs scripts/test/*.mjs scripts/test/assert/*.mjs scripts/test/unit/*.mjs scripts/test/functional/*.mjs scripts/test/sweeps/*.mjs scripts/test/fixtures/*.mjs; do node -c "$f"; done

      - name: Assertion half
        # THIS STEP IS THE ASSERTION HALF'S TWO RUNGS IN ONE INVOCATION (0.48.0 task 2.6), exactly as
        # the pre-commit hook runs them: one runner, handed `scripts/test/unit/*.test.mjs` and
        # `scripts/test/assert/*.test.mjs`, with ONE floor over both. The unit rung is not a fourth
        # bucket and gets no step of its own — it is a rung of this half with the same per-commit
        # trigger, so splitting it into a second step would give it a trigger of its own and a second
        # runner process to boot.
        #
        # THE FLOOR'S DECLARED COUNT COUNTS TWO DECLARATION SHAPES, for the reason the hook's does:
        # a file-rung test declares itself with `test(` and a unit-rung test with `unitTest(`. With
        # only `test(` counted, every unit file would contribute ZERO to `declared` while contributing
        # its tests to `total`, and a unit file that stopped running would drop from one side of the
        # floor and not the other.
        #
        # THE RUNNER'S DEFAULT PER-FILE ISOLATION, exactly as the pre-commit hook runs it (0.49.0,
        # design D3): the single-process mode is retired everywhere. Per-file isolation attributes a
        # failure to the FILE that failed, and on every supported major it measured about half the wall
        # clock of the single-process mode on a 16-CPU machine.
        run: |
          set -e
          FORCE_COLOR=0 node --test --test-reporter=spec scripts/test/unit/*.test.mjs scripts/test/assert/*.test.mjs > /tmp/assert.out 2>&1 || {
            cat /tmp/assert.out
            echo "::error::the assertion half FAILED — the runner's output is above"
            exit 1
          }
          total=$(grep -m1 -E '^ℹ tests ' /tmp/assert.out | awk '{print $3}')
          declared=$(git ls-files 'scripts/test/unit/*.test.mjs' 'scripts/test/assert/*.test.mjs' | xargs grep -c -E '^(test|unitTest)\(' | awk -F: '{s+=$NF} END {print s+0}')
          echo "assertion half: ran ${total}, declared ${declared}"
          if [ -z "$total" ]; then
            echo "::error::the assertion half's count could not be read — no '^ℹ tests' line in the runner's output"; exit 1
          fi
          if [ "$total" -lt "$declared" ]; then
            echo "::error::the assertion half ran ${total} tests but ${declared} are declared in its two rungs"; exit 1
          fi
          if [ "$total" -eq 0 ]; then
            echo "::error::the assertion half ran zero tests — a run of nothing is never a pass"; exit 1
          fi

      - name: Functional half
        # REAL git, through the real gateway — the half the pre-commit hook does not run. No record is
        # present in CI and none can be exchanged for this run.
        run: |
          set -e
          FORCE_COLOR=0 node --test --test-reporter=spec scripts/test/functional/*.test.mjs > /tmp/functional.out 2>&1 || {
            cat /tmp/functional.out
            echo "::error::the functional half FAILED — the runner's output is above"
            exit 1
          }
          total=$(grep -m1 -E '^ℹ tests ' /tmp/functional.out | awk '{print $3}')
          declared=$(git ls-files 'scripts/test/functional/*.test.mjs' | xargs grep -c '^test(' | awk -F: '{s+=$NF} END {print s+0}')
          echo "functional half: ran ${total}, declared ${declared}"
          if [ -z "$total" ]; then
            echo "::error::the functional half's count could not be read — no '^ℹ tests' line in the runner's output"; exit 1
          fi
          if [ "$total" -lt "$declared" ]; then
            echo "::error::the functional half ran ${total} tests but ${declared} are declared in scripts/test/functional/"; exit 1
          fi
          if [ "$total" -eq 0 ]; then
            echo "::error::the functional half ran zero tests — a run of nothing is never a pass"; exit 1
          fi

      - name: Sweep bucket
        # The change-triggered bucket: runs no git and starts no engine, and is too slow for the
        # per-commit half. Its own floor, from its own tracked files.
        run: |
          set -e
          FORCE_COLOR=0 node --test --test-reporter=spec scripts/test/sweeps/*.test.mjs > /tmp/sweeps.out 2>&1 || {
            cat /tmp/sweeps.out
            echo "::error::the sweep bucket FAILED — the runner's output is above"
            exit 1
          }
          total=$(grep -m1 -E '^ℹ tests ' /tmp/sweeps.out | awk '{print $3}')
          declared=$(git ls-files 'scripts/test/sweeps/*.test.mjs' | xargs grep -c '^test(' | awk -F: '{s+=$NF} END {print s+0}')
          echo "sweep bucket: ran ${total}, declared ${declared}"
          if [ -z "$total" ]; then
            echo "::error::the sweep bucket's count could not be read — no '^ℹ tests' line in the runner's output"; exit 1
          fi
          if [ "$total" -lt "$declared" ]; then
            echo "::error::the sweep bucket ran ${total} tests but ${declared} are declared in scripts/test/sweeps/"; exit 1
          fi
          if [ "$total" -eq 0 ]; then
            echo "::error::the sweep bucket ran zero tests — a run of nothing is never a pass"; exit 1
          fi

  # ─────────── THE REQUIRED CHECK: ONE CONTEXT NAMED `test` ───────────
  # Branch protection requires the single context `test`. A matrix leg reports as `test (node N)`,
  # so a bare matrix would leave every PR waiting on a check that never reports; this aggregate keeps
  # the name. `if: always()` IS LOAD-BEARING: a job whose `needs` failed is SKIPPED, and GitHub treats
  # a skipped required check as passing — without it, a failed compute job would skip every leg and
  # this job, and the PR would merge green. So it always runs, and it passes only when the set was
  # computed (or fell back) AND every leg passed.
  test:
    name: test
    if: always()
    needs: [node-majors, test-node]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every supported major passed
        run: |
          echo "node-majors: ${{ needs.node-majors.result }}; test-node: ${{ needs.test-node.result }}"
          if [ "${{ needs.node-majors.result }}" != "success" ] || [ "${{ needs.test-node.result }}" != "success" ]; then
            echo "::error::the required check fails: computing the supported majors was '${{ needs.node-majors.result }}' and the per-major legs were '${{ needs.test-node.result }}' — both must be 'success'"
            exit 1
          fi
