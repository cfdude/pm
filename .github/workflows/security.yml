name: Security Scans

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'openspec/**', '.conductor/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'openspec/**', '.conductor/**']
  schedule:
    # Weekly, so newly-disclosed CVEs are caught even when no code changes.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    # Pinned to a commit SHA (not @main) per the org's own pinGitHubActionDigests convention —
    # a moving branch ref would let a compromised or unexpectedly-changed org workflow silently
    # run in this repo's CI. Bump deliberately: re-check cfdude/.github before updating the SHA.
    uses: cfdude/.github/.github/workflows/security-semgrep.yml@d5d060809c6cd951e79a92e7069a8f719c7f6074  # main @ 2026-10-07 (trufflehog 3.97.0)
    permissions:
      contents: read
      security-events: write

  trivy:
    name: Trivy filesystem scan
    uses: cfdude/.github/.github/workflows/security-trivy.yml@d5d060809c6cd951e79a92e7069a8f719c7f6074  # main @ 2026-10-07 (trufflehog 3.97.0)
    permissions:
      contents: read
      security-events: write
